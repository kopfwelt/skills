<!--
  canvas-base.html — generischer Renderer für Design-Thinking-Canvases.

  Der Skill ersetzt beim Rendern ausschließlich den Block
  /*__METHOD_CONFIG__*/ durch ein JSON-Objekt mit diesem Schema:

  {
    "session_id":   "dt-2026-08-03-a1",       // Pflicht, vom Skill vergeben
    "method_id":    "crazy-8s",               // Pflicht, = id im Frontmatter
    "phase":        "ideate",                 // Pflicht
    "titel":        "Crazy 8s",               // Anzeigename
    "anleitung":    "8 Ideen in 8 Minuten …", // 1-3 Sätze, aus der Methodendatei
    "layout":       "grid" | "quadrants" | "list",
    "zeit_pro_zone": 60,                      // Sekunden, weglassen = kein Timer
    "kontext":      { "problem_statement": "…" },  // braucht_input-Werte
    "durchfuehrung": [                        // Ablauf-Schritte, ausklappbar hinter ⓘ
      { "titel": "Nutzer festlegen (5 min)", "text": "Eine konkrete Person …" }
    ],
    "tipps": [ "Wer zuerst abstimmt, ankert." ],   // Moderationshinweise, optional
    "zonen": [
      { "id": "z1", "titel": "Idee 1", "hinweis": "…",
        "info": "längere Erläuterung, ausklappbar hinter ⓘ" }  // optional
    ]
  }

  Alles andere in dieser Datei bleibt unverändert. Wenn eine Methode
  damit nicht darstellbar ist, ist das ein Schema-Problem — melden,
  nicht den Renderer forken.
-->
<meta charset="utf-8">
<title>Design-Thinking-Canvas</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6f6b64;
    --line: #e2ded7; --accent: #2f6f5e; --accent-ink: #ffffff;
    --active: #f0e9d8; --danger: #a4432f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191817; --panel: #232120; --ink: #ece9e4; --muted: #9b968e;
      --line: #38352f; --accent: #4d9a83; --accent-ink: #10201b;
      --active: #3a3423; --danger: #d07a5f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191817; --panel: #232120; --ink: #ece9e4; --muted: #9b968e;
    --line: #38352f; --accent: #4d9a83; --accent-ink: #10201b;
    --active: #3a3423; --danger: #d07a5f;
  }
  :root[data-theme="light"] {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6f6b64;
    --line: #e2ded7; --accent: #2f6f5e; --accent-ink: #ffffff;
    --active: #f0e9d8; --danger: #a4432f;
  }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem; }
  main { max-width: 64rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .phase-tag { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .anleitung { color: var(--muted); margin: .5rem 0 1rem; }
  .kontext { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: .75rem 1rem; margin-bottom: 1.25rem; }
  .kontext dt { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .kontext dd { margin: .1rem 0 .5rem; }
  .kontext dd:last-child { margin-bottom: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1.25rem; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: .4rem .9rem; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; min-width: 4.5rem; }
  .timer.warn { color: var(--danger); }
  details.info { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 1.25rem; }
  details.info > summary { cursor: pointer; padding: .6rem 1rem; font-weight: 600; list-style: none; display: flex; align-items: center; gap: .5rem; }
  details.info > summary::-webkit-details-marker { display: none; }
  details.info > summary .chev { margin-left: auto; transition: transform .15s; color: var(--muted); }
  details.info[open] > summary .chev { transform: rotate(90deg); }
  .info-badge { display: inline-flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .8rem; font-style: normal; font-weight: 700; flex: none; }
  details.info .body { padding: 0 1rem .9rem; }
  details.info ol { margin: 0 0 .5rem; padding-left: 1.3rem; }
  details.info ol li { margin-bottom: .4rem; }
  details.info ol li strong { display: block; }
  details.info .tipps { margin: .5rem 0 0; padding-left: 1.3rem; color: var(--muted); }
  details.info .tipps-titel { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: .75rem 0 .25rem; }
  details.zone-info { margin: 0 0 .5rem; }
  details.zone-info > summary { cursor: pointer; list-style: none; font-size: .8rem; color: var(--accent); display: inline-flex; align-items: center; gap: .3rem; }
  details.zone-info > summary::-webkit-details-marker { display: none; }
  details.zone-info p { font-size: .85rem; color: var(--muted); margin: .35rem 0 0; padding: .5rem .65rem; background: var(--bg); border-left: 3px solid var(--accent); border-radius: 4px; }
  .zones { display: grid; gap: .9rem; }
  .zones.grid { grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); }
  .zones.quadrants { grid-template-columns: repeat(2, 1fr); }
  .zones.list { grid-template-columns: 1fr; }
  @media (max-width: 40rem) { .zones.quadrants { grid-template-columns: 1fr; } }
  .zone { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .8rem; }
  .zone.active { background: var(--active); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .zone h2 { font-size: .95rem; margin: 0 0 .15rem; }
  .zone .hinweis { font-size: .8rem; color: var(--muted); margin: 0 0 .5rem; }
  .entries { list-style: none; margin: 0 0 .5rem; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
  .entries li { display: flex; gap: .4rem; align-items: flex-start; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: .35rem .55rem; }
  .entries li span { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
  .entries button { padding: 0 .45rem; line-height: 1.4; color: var(--muted); border: none; background: none; }
  .add-row { display: flex; gap: .4rem; }
  .add-row textarea { flex: 1; font: inherit; resize: vertical; min-height: 2.3rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); padding: .35rem .55rem; }
  .footer { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
  .footer label { color: var(--muted); font-size: .9rem; }
  .footer input[type="number"] { width: 4rem; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); padding: .3rem .4rem; }
  .hint { width: 100%; color: var(--muted); font-size: .9rem; }
  .status { font-size: .9rem; color: var(--accent); min-height: 1.2em; }
</style>

<main>
  <div class="phase-tag" id="phaseTag"></div>
  <h1 id="titel"></h1>
  <p class="anleitung" id="anleitung"></p>
  <details class="info" id="durchfuehrung" hidden>
    <summary><i class="info-badge">i</i> So wird's durchgeführt <span class="chev">›</span></summary>
    <div class="body">
      <ol id="schritte"></ol>
      <div id="tippsWrap" hidden>
        <p class="tipps-titel">Moderationshinweise</p>
        <ul class="tipps" id="tipps"></ul>
      </div>
    </div>
  </details>
  <dl class="kontext" id="kontext" hidden></dl>

  <div class="toolbar" id="timerbar" hidden>
    <button class="primary" id="timerBtn">Timer starten</button>
    <span class="timer" id="timerDisplay">–:––</span>
    <span id="timerZone" class="hint" style="width:auto"></span>
  </div>

  <div class="zones" id="zones"></div>

  <div class="footer">
    <label>Teilnehmende: <input type="number" id="teilnehmer" min="1" max="99"></label>
    <button class="primary" id="exportBtn">Ergebnis exportieren</button>
    <span class="status" id="status"></span>
    <p class="hint">Fertig? Export klicken und das kopierte JSON hier in den Chat einfügen.</p>
  </div>
</main>

<script>
const CONFIG = /*__METHOD_CONFIG__*/;

const STORAGE_KEY = "dt:" + CONFIG.session_id;

/* Persistenz: window.storage (claude.ai-Artefakte) mit localStorage-Fallback. */
const store = {
  async get() {
    try {
      if (window.storage?.get) {
        const v = await window.storage.get(STORAGE_KEY);
        return v ? JSON.parse(typeof v === "string" ? v : v.value) : null;
      }
    } catch (e) {}
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
  },
  async set(data) {
    const s = JSON.stringify(data);
    try { if (window.storage?.set) { await window.storage.set(STORAGE_KEY, s); return; } } catch (e) {}
    try { localStorage.setItem(STORAGE_KEY, s); } catch (e) {}
  }
};

let state = { entries: {}, teilnehmer: null, elapsedS: 0 };
CONFIG.zonen.forEach(z => state.entries[z.id] = state.entries[z.id] || []);

function saveState() { store.set(state); }

/* --- Kopf --- */
document.getElementById("phaseTag").textContent = CONFIG.phase + " · " + CONFIG.method_id + " · " + CONFIG.session_id;
document.getElementById("titel").textContent = CONFIG.titel || CONFIG.method_id;
document.getElementById("anleitung").textContent = CONFIG.anleitung || "";
document.title = (CONFIG.titel || CONFIG.method_id) + " – Canvas";

/* --- Durchführungs-Panel (ⓘ) --- */
if (CONFIG.durchfuehrung?.length) {
  const panel = document.getElementById("durchfuehrung");
  panel.hidden = false;
  const ol = document.getElementById("schritte");
  for (const s of CONFIG.durchfuehrung) {
    const li = document.createElement("li");
    if (s.titel) { const b = document.createElement("strong"); b.textContent = s.titel; li.append(b); }
    li.append(document.createTextNode(s.text || ""));
    ol.append(li);
  }
  if (CONFIG.tipps?.length) {
    document.getElementById("tippsWrap").hidden = false;
    const ul = document.getElementById("tipps");
    for (const t of CONFIG.tipps) {
      const li = document.createElement("li"); li.textContent = t; ul.append(li);
    }
  }
}

const ktx = document.getElementById("kontext");
const kontextEntries = Object.entries(CONFIG.kontext || {});
if (kontextEntries.length) {
  ktx.hidden = false;
  for (const [k, v] of kontextEntries) {
    const dt = document.createElement("dt"); dt.textContent = k.replaceAll("_", " ");
    const dd = document.createElement("dd"); dd.textContent = typeof v === "string" ? v : JSON.stringify(v);
    ktx.append(dt, dd);
  }
}

/* --- Zonen --- */
const zonesEl = document.getElementById("zones");
zonesEl.className = "zones " + (CONFIG.layout || "list");

function renderZone(zone) {
  const el = document.createElement("section");
  el.className = "zone"; el.id = "zone-" + zone.id;
  const h = document.createElement("h2"); h.textContent = zone.titel; el.append(h);
  if (zone.hinweis) { const p = document.createElement("p"); p.className = "hinweis"; p.textContent = zone.hinweis; el.append(p); }
  if (zone.info) {
    const det = document.createElement("details"); det.className = "zone-info";
    const sum = document.createElement("summary");
    const badge = document.createElement("i"); badge.className = "info-badge"; badge.textContent = "i";
    sum.append(badge, document.createTextNode(" Mehr dazu"));
    const p = document.createElement("p"); p.textContent = zone.info;
    det.append(sum, p); el.append(det);
  }
  const ul = document.createElement("ul"); ul.className = "entries"; el.append(ul);

  function renderEntries() {
    ul.replaceChildren(...state.entries[zone.id].map((text, i) => {
      const li = document.createElement("li");
      const span = document.createElement("span"); span.textContent = text;
      const del = document.createElement("button"); del.textContent = "×"; del.title = "Entfernen";
      del.onclick = () => { state.entries[zone.id].splice(i, 1); saveState(); renderEntries(); };
      li.append(span, del);
      return li;
    }));
  }
  renderEntries();
  el._renderEntries = renderEntries;

  const row = document.createElement("div"); row.className = "add-row";
  const ta = document.createElement("textarea"); ta.placeholder = "Eintrag …";
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); add(); } });
  const btn = document.createElement("button"); btn.textContent = "+"; btn.onclick = add;
  function add() {
    const t = ta.value.trim(); if (!t) return;
    state.entries[zone.id].push(t); ta.value = ""; saveState(); renderEntries(); ta.focus();
  }
  row.append(ta, btn); el.append(row);
  return el;
}
CONFIG.zonen.forEach(z => zonesEl.append(renderZone(z)));

/* --- Timer (nur wenn zeit_pro_zone gesetzt) --- */
let ticker = null;
if (CONFIG.zeit_pro_zone) {
  document.getElementById("timerbar").hidden = false;
  const display = document.getElementById("timerDisplay");
  const zoneLabel = document.getElementById("timerZone");
  const btn = document.getElementById("timerBtn");
  let idx = -1, remaining = 0;

  function highlight() {
    document.querySelectorAll(".zone").forEach(z => z.classList.remove("active"));
    if (idx >= 0 && idx < CONFIG.zonen.length)
      document.getElementById("zone-" + CONFIG.zonen[idx].id)?.classList.add("active");
  }
  function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function tick() {
    state.elapsedS++; remaining--;
    if (remaining <= 0) {
      idx++;
      if (idx >= CONFIG.zonen.length) { stop("Fertig — alle Zonen durch."); return; }
      remaining = CONFIG.zeit_pro_zone;
      zoneLabel.textContent = "Aktuelle Zone: " + CONFIG.zonen[idx].titel;
      highlight();
    }
    display.textContent = fmt(remaining);
    display.classList.toggle("warn", remaining <= 10);
    if (state.elapsedS % 5 === 0) saveState();
  }
  function stop(msg) {
    clearInterval(ticker); ticker = null; idx = -1; highlight();
    btn.textContent = "Timer starten"; zoneLabel.textContent = msg || ""; saveState();
  }
  btn.onclick = () => {
    if (ticker) { stop("Pausiert."); return; }
    if (idx < 0) { idx = 0; remaining = CONFIG.zeit_pro_zone; }
    zoneLabel.textContent = "Aktuelle Zone: " + CONFIG.zonen[idx].titel;
    highlight(); btn.textContent = "Stopp";
    display.textContent = fmt(remaining);
    ticker = setInterval(tick, 1000);
  };
} else {
  /* Ohne Zonentimer trotzdem Gesamtdauer messen, sobald erste Eingabe passiert. */
  let started = false;
  zonesEl.addEventListener("input", () => {
    if (started) return; started = true;
    setInterval(() => { state.elapsedS++; if (state.elapsedS % 15 === 0) saveState(); }, 1000);
  }, { once: false });
}

/* --- Teilnehmende --- */
const tnInput = document.getElementById("teilnehmer");
tnInput.addEventListener("change", () => {
  state.teilnehmer = tnInput.value ? parseInt(tnInput.value, 10) : null; saveState();
});

/* --- Export gemäß references/export-contract.md (v1) --- */
document.getElementById("exportBtn").onclick = async () => {
  const payload = {
    contract_version: 1,
    session_id: CONFIG.session_id,
    method_id: CONFIG.method_id,
    phase: CONFIG.phase,
    kontext: CONFIG.kontext || {},
    eingaben: CONFIG.zonen.flatMap(z =>
      state.entries[z.id].map(text => ({ zone: z.id, text, autor: null }))
    ),
    meta: {
      dauer_tatsaechlich_min: state.elapsedS ? Math.round(state.elapsedS / 60) : null,
      teilnehmer: state.teilnehmer,
      exportiert_am: new Date().toISOString()
    }
  };
  const json = JSON.stringify(payload, null, 2);
  const status = document.getElementById("status");
  try {
    await navigator.clipboard.writeText(json);
    status.textContent = "Kopiert (" + payload.eingaben.length + " Einträge) — jetzt im Chat einfügen.";
  } catch (e) {
    /* Clipboard im Sandbox-iframe ggf. blockiert: JSON anzeigen zum Handkopieren. */
    const pre = document.createElement("textarea");
    pre.value = json; pre.style.cssText = "width:100%;min-height:12rem;margin-top:.75rem;font:12px/1.4 monospace;";
    document.querySelector(".footer").append(pre); pre.select();
    status.textContent = "Zwischenablage blockiert — JSON unten manuell kopieren.";
  }
};

/* --- Gespeicherten Stand laden --- */
store.get().then(saved => {
  if (!saved) return;
  state = { entries: {}, teilnehmer: saved.teilnehmer ?? null, elapsedS: saved.elapsedS || 0 };
  CONFIG.zonen.forEach(z => state.entries[z.id] = (saved.entries && saved.entries[z.id]) || []);
  if (state.teilnehmer) tnInput.value = state.teilnehmer;
  document.querySelectorAll(".zone").forEach(el => el._renderEntries && el._renderEntries());
});
</script>
